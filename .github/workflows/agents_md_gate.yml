# Fix 3 Checkpoint 2's mechanical merge-time gate (design\update_trust_review.md, Phase 3).
# Runs scripts\check_agents_pr_gate.py against any PR touching AGENTS.md. Paired with
# .github\CODEOWNERS (requires operator review on AGENTS.md) and branch protection on `main`
# requiring both this check and that review before merge.
#
# NOTE: branch protection itself can't be enabled yet - GitHub's Free tier doesn't support branch
# protection on private repos at all (only Pro/Team+, or public repos, which get it free). This
# workflow runs and reports either way, but isn't wired as a *required* status check until this
# repo goes public or the plan changes (project_progress.md Next Up tracks this).
#
# Security note: the PR body is untrusted, attacker-controlled text. It is passed to the script
# via `env:`, never interpolated directly into a `run:` shell block - interpolating
# `${{ github.event.pull_request.body }}` inline is a known GitHub Actions script-injection vector.

name: AGENTS.md Fix 3 gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'

permissions:
  contents: read

jobs:
  agents-md-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Fix 3 Checkpoint 2 mechanical gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/check_agents_pr_gate.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --pr-body-env PR_BODY
