# General PR gate - runs on EVERY PR, not just ones touching AGENTS.md (see agents_md_gate.yml for
# that narrower, AGENTS.md-content-specific gate). Built 2026-07-27 after a live discussion found
# that the AGENTS.md-specific checks alone don't defend against a deliberate adversary adding a
# second AI-directive file elsewhere, a script in a language none of the Python-specific checkers
# read, or a script hidden somewhere unexpected - design\update_trust_review.md's own threat model
# is a malicious/compromised actor, not just carelessness, so this gate assumes that.
#
# Two checks:
#   - check_file_surface.py: known-AI-directive-filename, language/location, and binary-file checks
#     (hard), plus a disguised-code content heuristic (soft).
#   - check_scripts_gate.py: consistency_check.py static analysis over every changed script under
#     hooks\/scripts\/agents\.
#
# Same branch-protection caveat as agents_md_gate.yml: not wired as a *required* status check yet -
# GitHub Free tier doesn't support branch protection on a private repo, and this repo is still
# private. Runs and reports either way.
#
# Third-party Actions below are pinned to a full commit SHA, not a mutable version tag - same
# tj-actions/changed-files (CVE-2025-30066) rationale as agents_md_gate.yml; see that file's header.

name: General PR gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  general-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: File-surface classifier
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/check_file_surface.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      - name: Changed-script consistency sweep
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/check_scripts_gate.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
