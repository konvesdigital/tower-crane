# Golden regression expectations for the consistency_check hook.
# Consumed by the runner in scripts\check_tower_crane.py (pass A).
# Each key is a fixture in this folder; each value asserts the checker's exit
# code and a substring that must appear in its output.
#
# fixture -> { exit, must_contain }

pass_params.py:
  exit: 0
  must_contain: "[PASS]"

fail_undefined.py:
  exit: 2
  must_contain: "Name 'y'"

pass_unpacking.py:
  exit: 0
  must_contain: "[PASS]"

pass_defaults.py:
  exit: 0
  must_contain: "[PASS]"

fail_arity.py:
  exit: 2
  must_contain: "Function 'report'"

pass_stringkey_false_positives.py:
  exit: 0
  must_contain: "[PASS]"

fail_stringkey.py:
  exit: 2
  must_contain: "user_id"

pass_kwargs.py:
  exit: 0
  must_contain: "[PASS]"

fail_kwargs_missing.py:
  exit: 2
  must_contain: "Function 'build'"
